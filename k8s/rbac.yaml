apiVersion: v1
kind: ServiceAccount
metadata:
  name: ctr-inference-app
  namespace: ctr-inference
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: triton-server
  namespace: ctr-inference
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ctr-inference-app
  namespace: ctr-inference
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ctr-inference-app
  namespace: ctr-inference
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ctr-inference-app
subjects:
  - kind: ServiceAccount
    name: ctr-inference-app
    namespace: ctr-inference
