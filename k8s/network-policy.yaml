apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ctr-inference-network-policy
  namespace: ctr-inference
spec:
  podSelector:
    matchLabels:
      app: ctr-inference-app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: api-consumer
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 8001
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: triton-server
      ports:
        - protocol: TCP
          port: 8001
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53  # DNS
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: triton-server-network-policy
  namespace: ctr-inference
spec:
  podSelector:
    matchLabels:
      app: triton-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ctr-inference-app
      ports:
        - protocol: TCP
          port: 8001  # gRPC
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 8002  # Metrics
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443  # HTTPS for model downloads if needed
