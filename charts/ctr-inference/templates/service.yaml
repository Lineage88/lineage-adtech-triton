apiVersion: v1
kind: Service
metadata:
  name: {{ include "ctr-inference.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ctr-inference.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "ctr-inference.selectorLabels" . | nindent 4 }}
    component: app
---
{{- if .Values.triton.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ctr-inference.fullname" . }}-triton
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ctr-inference.labels" . | nindent 4 }}
    component: triton
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
    - port: 8001
      targetPort: grpc
      protocol: TCP
      name: grpc
    - port: 8002
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "ctr-inference.selectorLabels" . | nindent 4 }}
    component: triton
{{- end }}
