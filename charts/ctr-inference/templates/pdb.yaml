{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ctr-inference.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ctr-inference.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "ctr-inference.selectorLabels" . | nindent 6 }}
      component: app
{{- end }}
