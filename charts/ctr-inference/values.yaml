replicaCount: 3

image:
  repository: lineage88/lineage-adtech-triton
  pullPolicy: IfNotPresent
  tag: "latest"

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8001"
  prometheus.io/path: "/metrics"

podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8000
  metricsPort: 8001
  annotations: {}

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: ctr-inference.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - ctr-inference
          topologyKey: kubernetes.io/hostname

lifecycle:
  preStop:
    exec:
      command: ["/bin/sh", "-c", "sleep 15"]

terminationGracePeriodSeconds: 30

config:
  triton:
    host: ctr-inference-triton
    port: 8001
    modelName: ctr_model
    modelVersion: "1"
    timeoutMs: 60000
  app:
    host: 0.0.0.0
    port: 8000
    env: production
  logging:
    level: INFO
  features:
    expectedDim: 20
    maxDim: 100
  metrics:
    enabled: true
    port: 8001
  cors:
    enabled: false

secrets:
  apiKey: "change-me-to-secure-key-in-production"
  tritonAuthToken: ""

triton:
  enabled: true
  replicaCount: 1
  image:
    repository: nvcr.io/nvidia/tritonserver
    tag: "24.03-py3"
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi
  modelRepository:
    size: 5Gi
  sharedMemory:
    size: 1Gi

probes:
  liveness:
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3
  startup:
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30

pdb:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true
